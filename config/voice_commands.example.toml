# User-editable voice command overlay.
#
# Copy this file to config/voice_commands.toml and edit the copy.
# Behavior stays in Python command classes; this file only changes enabled
# status, synonyms, and wake-hint display metadata.
#
# Rules:
# - command table names must match BaseCommand.name from commands/*.py
# - every synonym must contain at least two words after normalization
# - mode = "extend" adds synonyms to built-in defaults
# - mode = "replace" replaces built-in synonyms for that command
# - enabled = false disables a non-GLOBAL command

version = 1

[commands.stop]
enabled = true
mode = "extend"
synonyms = []
hint = "закончи работу"
show_in_hints = false

[commands.pause]
enabled = true
mode = "extend"
synonyms = [
  # "поставь фильм на паузу",
  # "приостанови видео",
]
hint = "пауза"
show_in_hints = true
order = 4

[commands.resume]
enabled = true
mode = "extend"
synonyms = [
  # "продолжай видео",
]
hint = "продолжи"
show_in_hints = true
order = 5

[commands.volume_up]
